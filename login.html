<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in, Quartz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="favicon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="./">
      <img class="brand-mark" src="logo.png" alt="" width="28" height="28">
      <span>Quartz</span>
    </a>
    <nav class="nav-links">
      <a href="./#mods">Mods</a>
      <a href="./#installing">Installing</a>
      <a href="./#request">New Mod Request</a>
    </nav>
    <div class="nav-account" id="nav-account"></div>
  </div>
</header>

<main>
  <section class="hero narrow">
    <div class="wrap">
      <h1 id="title">Sign in</h1>
      <p class="lead">You need an account to send mod requests. Downloading mods does not need one.</p>

      <form id="login-form" class="form">
        <label id="name-field" hidden>
          <span>Display name</span>
          <input name="display_name" type="text" maxlength="24" autocomplete="nickname">
        </label>
        <label>
          <span>Email</span>
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" required minlength="6" autocomplete="current-password">
        </label>
        <div class="form-actions">
          <button class="btn-primary" type="submit" id="submit">Sign in</button>
          <button class="btn-ghost" type="button" id="toggle">Create an account</button>
          <span class="form-status" id="status"></span>
        </div>
      </form>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <span>Quartz is not affiliated with Web Dashers or RobTop Games.</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
